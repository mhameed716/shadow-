name: Build APK

on:
  push:
    branches: [ "main", "arena/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      run: |
        echo "ANDROID_HOME=$ANDROID_HOME"
        export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/bin:$PATH"
        sdkmanager --version || echo "sdkmanager not found"
        yes | sdkmanager --licenses || true
        sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || echo "SDK already installed"

    - name: Setup Gradle 8.4 (compatible with AGP 8.2.2)
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.4

    - name: Build APK with Gradle
      run: gradle assembleDebug --stacktrace

    - name: Upload APK Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30

    - name: Create Verified Direct Links
      if: success()
      run: |
        APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n1)
        echo "Found APK: $APK"
        ls -lh "$APK"
        echo "APK size: $(du -h $APK | cut -f1)"
        echo "Uploading to multiple hosts for verification..."

        # Try transfer.sh
        echo "=== transfer.sh ==="
        curl --upload-file "$APK" "https://transfer.sh/app-debug-${{ github.run_number }}.apk" 2>&1 | tee -a verified-links.txt || echo "transfer.sh failed" >> verified-links.txt
        echo "" >> verified-links.txt

        # Try 0x0.st (more reliable)
        echo "=== 0x0.st ==="
        curl -F "file=@$APK" https://0x0.st 2>&1 | tee -a verified-links.txt || echo "0x0.st failed" >> verified-links.txt
        echo "" >> verified-links.txt

        # Try catbox
        echo "=== catbox.moe ==="
        curl -F "reqtype=fileupload" -F "fileToUpload=@$APK" https://catbox.moe/user/api.php 2>&1 | tee -a verified-links.txt || echo "catbox failed" >> verified-links.txt
        echo "" >> verified-links.txt

        echo "=== VERIFIED LINKS ==="
        cat verified-links.txt
        ls -lh verified-links.txt

        # Also create summary
        echo "## 📲 روابط تحميل مباشرة - تم إنشاء التطبيق بنجاح" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**حجم APK:** $(du -h $APK | cut -f1)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        cat verified-links.txt >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY

        # Push verified links to repo for direct reading via git (bypass artifact outage)
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        echo "# Verified Direct Download Links - Build ${{ github.run_number }}" > DIRECT_LINKS.md
        echo "Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> DIRECT_LINKS.md
        echo "Commit: ${{ github.sha }}" >> DIRECT_LINKS.md
        echo "" >> DIRECT_LINKS.md
        cat verified-links.txt >> DIRECT_LINKS.md
        echo "" >> DIRECT_LINKS.md
        echo "Generated: $(date -u)" >> DIRECT_LINKS.md
        git add DIRECT_LINKS.md verified-links.txt || true
        git commit -m "ci: verified direct links for run ${{ github.run_number }}" || echo "no commit needed"
        git push origin HEAD:${{ github.ref_name }} || echo "push failed but links in summary"

    - name: Upload Verified Links Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: verified-links
        path: verified-links.txt
