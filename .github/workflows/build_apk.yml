name: Build APK

on:
  push:
    branches: [ "main", "arena/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      run: |
        echo "ANDROID_HOME=$ANDROID_HOME"
        export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/bin:$PATH"
        sdkmanager --version || echo "sdkmanager not found"
        yes | sdkmanager --licenses || true
        sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || echo "SDK already installed"

    - name: Setup Gradle 8.4 (compatible with AGP 8.2.2)
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.4

    - name: Build APK with Gradle
      run: gradle assembleDebug --stacktrace

    - name: Upload APK Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30

    - name: Create GitHub Release with Direct Download
      if: success()
      uses: softprops/action-gh-release@v1
      with:
        tag_name: build-${{ github.run_number }}
        name: Build ${{ github.run_number }} - APK
        body: |
          APK built from commit ${{ github.sha }}
          Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Direct download available below.
        files: app/build/outputs/apk/debug/*.apk
        generate_release_notes: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create Verified Direct Links File
      if: success()
      run: |
        echo "## Build ${{ github.run_number }} - Direct Download" > DIRECT_LINKS.md
        echo "" >> DIRECT_LINKS.md
        echo "APK built successfully!" >> DIRECT_LINKS.md
        echo "" >> DIRECT_LINKS.md
        echo "### GitHub Release (direct, no login required):" >> DIRECT_LINKS.md
        echo "https://github.com/${{ github.repository }}/releases/download/build-${{ github.run_number }}/app-debug.apk" >> DIRECT_LINKS.md
        echo "" >> DIRECT_LINKS.md
        echo "### GitHub Actions Artifact (requires login, may be delayed due to outage):" >> DIRECT_LINKS.md
        echo "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> DIRECT_LINKS.md
        echo "" >> DIRECT_LINKS.md
        echo "Commit: ${{ github.sha }}" >> DIRECT_LINKS.md
        cat DIRECT_LINKS.md
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add DIRECT_LINKS.md
        git commit -m "ci: direct download links for build ${{ github.run_number }}" || true
        git push origin HEAD:${{ github.ref_name }} || true
