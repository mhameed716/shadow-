name: Build APK

on:
  push:
    branches: [ "main", "arena/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      run: |
        echo "ANDROID_HOME=$ANDROID_HOME"
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
        # SDK is preinstalled on ubuntu-latest; just verify and ensure PATH
        export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/bin:$PATH"
        ls -la "$ANDROID_HOME/cmdline-tools/latest/bin/" || ls -la "$ANDROID_HOME/cmdline-tools/" || true
        sdkmanager --version || echo "sdkmanager not in PATH, will use preinstalled SDK"
        yes | sdkmanager --licenses || true
        sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || echo "SDK components already installed or install skipped"
        sdkmanager --list_installed || true

    - name: Setup Gradle 8.4 (compatible with AGP 8.2.2)
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.4

    - name: Build APK with Gradle
      run: gradle assembleDebug --stacktrace

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk
