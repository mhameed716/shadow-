name: Build APK

on:
  push:
    branches: [ "main", "arena/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK components
      run: |
        echo "ANDROID_HOME=$ANDROID_HOME"
        ls -la $ANDROID_HOME || true
        sdkmanager --version || true
        yes | sdkmanager --licenses || true
        sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || echo "install done/skip"
        sdkmanager --list_installed || true

    - name: Setup Gradle 8.4 (compatible with AGP 8.2.2)
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.4
        cache-read-only: false

    - name: Project diagnostics
      run: |
        echo "=== settings.gradle ==="; cat settings.gradle; echo
        echo "=== build.gradle ==="; cat build.gradle; echo
        echo "=== app/build.gradle ==="; cat app/build.gradle; echo
        echo "=== gradle.properties ==="; cat gradle.properties || true
        echo "=== wrapper ==="; cat gradle/wrapper/gradle-wrapper.properties || true
        echo "=== java ==="; java -version
        echo "=== gradle ==="; gradle --version
        echo "=== files ==="; find . -type f | sort

    - name: Build APK with Gradle
      id: build
      run: |
        set +e
        gradle assembleDebug --stacktrace 2>&1 | tee build.log
        EXIT_CODE=${PIPESTATUS[0]}
        echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
        echo "## Build Result - Exit $EXIT_CODE" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        # Extract key error sections
        echo "### Key errors" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        grep -n -i -A5 -B5 "FAILURE\|What went wrong\|error\|exception\|FAILED\|not found\|missing\|could not" build.log | head -n 300 >> $GITHUB_STEP_SUMMARY || true
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Tail 150" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        tail -n 150 build.log >> $GITHUB_STEP_SUMMARY || true
        echo '```' >> $GITHUB_STEP_SUMMARY
        
        # Emit critical lines as annotations (visible via API)
        echo "--- EMIT ANNOTATIONS ---"
        grep -i "What went wrong\|FAILURE\|error:" build.log | head -n 20 | while IFS= read -r line; do
          # Escape % and newline for github
          safe=$(echo "$line" | tr -d '\r' | head -c 500)
          echo "::error::$safe"
        done || true
        grep -i "could not\|not found\|missing\|failed" build.log | head -n 30 | while IFS= read -r line; do
          safe=$(echo "$line" | tr -d '\r' | head -c 500)
          echo "::warning::$safe"
        done || true
        
        if [ $EXIT_CODE -ne 0 ]; then
          echo "::error::Gradle build failed with exit $EXIT_CODE"
        fi
        exit $EXIT_CODE

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: warn

    - name: Upload build log artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: build.log
        if-no-files-found: error
