name: Build APK

on:
  push:
    branches: [ "main", "arena/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      run: |
        echo "ANDROID_HOME=$ANDROID_HOME"
        export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/bin:$PATH"
        ls -la "$ANDROID_HOME/cmdline-tools/latest/bin/" || true
        sdkmanager --version || echo "sdkmanager not in PATH"
        yes | sdkmanager --licenses || true
        sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || echo "SDK already installed"
        sdkmanager --list_installed || true

    - name: Setup Gradle 8.4 (compatible with AGP 8.2.2)
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.4

    - name: Build APK with Gradle
      run: gradle assembleDebug --stacktrace

    - name: Upload APK Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30

    - name: Create Direct Download Link (transfer.sh)
      if: success()
      run: |
        APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n1)
        echo "Found APK: $APK"
        ls -lh "$APK"
        # Upload to transfer.sh for direct public download (no login required)
        echo "Uploading to transfer.sh..."
        curl --upload-file "$APK" "https://transfer.sh/app-debug-${{ github.run_number }}.apk" --silent --show-error | tee direct-link.txt
        echo "" >> direct-link.txt
        echo "Direct link saved to direct-link.txt"
        cat direct-link.txt
        # Also add to summary for easy copy
        echo "## 📲 رابط تحميل مباشر" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "APK تم بناؤه بنجاح! حجم: $(du -h $APK | cut -f1)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### رابط مباشر (بدون تسجيل دخول):" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        cat direct-link.txt >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### رابط GitHub Actions (يتطلب تسجيل دخول):" >> $GITHUB_STEP_SUMMARY
        echo "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY

    - name: Upload Direct Link Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: direct-link
        path: direct-link.txt
