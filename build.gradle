// Top-level build file - fixed for Gradle 8.x / AGP 8.x
// This replaces the old buildscript + allprojects pattern that fails on Gradle 8.7+ / 9.x
// repositories are now defined in settings.gradle via dependencyResolutionManagement

plugins {
    id 'com.android.application' version '8.2.2' apply false
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
